<!-- index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Book'd - Support & Privacy</title>
  <style>
    :root {
      --bg: #f7f7f2;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #555;
      --accent: #1f6feb;
      --border: #e5e7eb;
    }
    body {
      margin: 0;
      font-family: "Avenir Next", "SF Pro Text", -apple-system, sans-serif;
      background: linear-gradient(180deg, #f7f7f2 0%, #eef3ff 100%);
      color: var(--text);
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    h1 { margin-top: 0; font-size: 2rem; }
    p { line-height: 1.6; color: var(--muted); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links a {
      display: inline-block;
      margin-right: 16px;
      margin-top: 8px;
      font-weight: 600;
    }
    .small { font-size: 0.92rem; color: var(--muted); margin-top: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Book'd</h1>
      <p>Official support and privacy pages for the Book'd iOS app.</p>
      <div class="links">
        <a href="./support.html">Support</a>
        <a href="./privacy.html">Privacy Policy</a>
      </div>
      <p class="small">Maintained by Will Keller</p>
    </div>
  </div>
</body>
</html>
